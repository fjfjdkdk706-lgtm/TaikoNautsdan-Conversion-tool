<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="Shift_JIS">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaikoNauts 変換ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --text-main: #333333;
            --border: #e1e4e8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            position: relative;
        }
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 40px;
        }
        .lang-switcher select {
            width: auto;
            padding: 5px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            color: #2c3e50;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .box {
            border: 2px dashed #bdc3c7;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        .box:hover {
            border-color: var(--primary);
            background: #f0f7ff;
        }
        .box p { margin: 0; font-size: 1.1rem; color: #7f8c8d; }
        
        #settings-area {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            text-align: left;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #34495e;
        }
        .form-note {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 4px;
            margin-bottom: 8px;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 1rem;
            background: white;
            box-sizing: border-box;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .song-option {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
        }
        .song-option input {
            transform: scale(1.2);
            margin-right: 10px;
            cursor: pointer;
        }
        .song-option label {
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            opacity: 0.5;
            pointer-events: none;
            transition: 0.2s;
        }
        button.active { opacity: 1; pointer-events: auto; }
        button:hover { filter: brightness(0.9); }

        #log {
            margin-top: 30px;
            background: #2d3436;
            color: #dfe6e9;
            padding: 15px;
            border-radius: 6px;
            height: 250px;
            overflow-y: auto;
            font-family: Consolas, monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .log-ok { color: #55efc4; }
        .log-warn { color: #ffeaa7; }
        .log-err { color: #ff7675; }
        .log-info { color: #74b9ff; }

        .image-select-row {
            margin-bottom: 15px;
            padding: 10px;
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
        }
        .image-select-row label {
            font-size: 0.85rem;
            color: #2c3e50;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .multi-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
        }
        .multi-label {
            width: 130px;
            font-weight: bold;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 10px;
            color: var(--primary);
        }
        .multi-input {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <select id="lang-select">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
        </select>
    </div>

    <h1 data-i18n="title">TaikoNauts 変換ツール</h1>
    <div class="subtitle">v6.0 - Exact Plate & Multi-Language Edition</div>

    <div class="box" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p data-i18n="dropZone">ここにフォルダをドラッグ＆ドロップ</p>
        <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none">
    </div>
    <div id="status" style="text-align:center; margin-top:15px; font-weight:bold;"></div>

    <div id="settings-area">
        
       <div class="form-group">
            <label class="form-label" data-i18n="rankLabel">① 段位ランクを選択</label>
            <div class="form-note" data-i18n="rankNote">DanIndex(0-18)を決定します。</div>
            <select id="rank-select">
                <optgroup label="級位 ( Index:0-4)">
                    <option value="1">五級 (1)</option>
                    <option value="2">四級 (2)</option>
                    <option value="3">三級 (3)</option>
                    <option value="4">二級 (4)</option>
                    <option value="5">一級 (5)</option>
                </optgroup>
                <optgroup label="青段位 (Index:5-9)">
                    <option value="6" selected>初段 (6)</option>
                    <option value="7">二段 (7)</option>
                    <option value="8">三段 (8)</option>
                    <option value="9">四段 (9)</option>
                    <option value="10">五段 (10)</option>
                </optgroup>
                <optgroup label="赤段位 (Index:10-14)">
                    <option value="11">六段 (11)</option>
                    <option value="12">七段 (12)</option>
                    <option value="13">八段 (13)</option>
                    <option value="14">九段 (14)</option>
                    <option value="15">十段 (15)</option>
                </optgroup>
                <optgroup label="人段位 (Index:15-18)">
                    <option value="16">玄人 (16)</option>
                    <option value="17">名人 (17)</option>
                    <option value="18">超人 (18)</option>
                    <option value="19">達人 (19)</option>
                </optgroup>
                <optgroup label="外伝 (Index:19)">
                    <option value="20">外伝 (20)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="titleLabel">② 段位タイトル (フォルダ名)</label>
            <div class="form-note" data-i18n="titleNote">フォルダ名とJSONのタイトルになります。</div>
            <input type="text" id="dan-title-input" placeholder="段位名を入力">
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="imageLabel">③ 画像設定 (段位プレート)</label>
            <div class="form-note" data-i18n="imageNote">ドロップしたフォルダ内に画像がない場合は、対応するデフォルト画像が自動取得されます。</div>
            <div class="image-select-row">
                <label data-i18n="plateLabel">・段位プレート (danPlatePath)</label>
                <select id="plate-select"></select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="hiddenLabel">④ 隠し曲設定</label>
            <div id="song-list-container"></div>
        </div>
    </div>

    <button id="runBtn" data-i18n="btnRun">変換開始</button>

    <div id="log" data-i18n="logReady">準備完了...</div>
</div>

<script>
    // 多言語データ辞書
    const i18n = {
        ja: {
            title: "TaikoNauts 変換ツール",
            dropZone: "ここにフォルダをドラッグ＆ドロップ",
            rankLabel: "① 段位ランクを選択",
            rankNote: "DanIndex(0-18)を決定します。",
            titleLabel: "② 段位タイトル (フォルダ名)",
            titleNote: "フォルダ名とJSONのタイトルになります。",
            titlePlaceholder: "段位名を入力",
            imageLabel: "③ 画像設定 (段位プレート)",
            imageNote: "ドロップしたフォルダ内に画像がない場合は、対応するデフォルト画像が自動取得されます。",
            plateLabel: "・段位プレート (danPlatePath)",
            plateAuto: "(自動検索して適用)",
            hiddenLabel: "④ 隠し曲設定",
            songSuffix: "曲目",
            btnRun: "変換開始",
            btnProcessing: "処理中...",
            btnComplete: "完了！",
            btnError: "エラー",
            logReady: "準備完了...",
            defTitleLabel: "★ コース全体タイトル (dan.def)",
            defTitleNote: "ゲーム内に表示される全体のフォルダ名になります。また、ダウンロードされるZIPファイル名にも適用されます。",
            defTitlePlaceholder: "段位道場",
            statusDetected: "{count} 個の段位フォルダを検出",
            logDetected: "{count} 個のTJAを検出しました。一括設定が可能です。",
            logNoTja: "エラー: フォルダ内にTJAファイルが見つかりません。",
            logParseError: "[{folder}] 解析エラー: {msg}",
            logProcessing: "[処理開始] {title} (Rank Index: {index})",
            logResizing: "[{title}] plateのサイズを1.5倍にリサイズ中...",
            logResizeFail: "[{title}] plateのリサイズに失敗したため、元のサイズで保存します。({msg})",
            logPlateFail: "[{title}] plate.png の取得に失敗しました。",
            logNetError: "通信エラー: {img} ({msg})",
            logFolderComplete: "[{title}] フォルダの構築が完了しました。",
            logDefGenerated: "複数フォルダが検出されたため、dan.def ({title}) を生成しました。",
            logAllComplete: "全処理完了。一括ダウンロードを開始しました。"
        },
        en: {
            title: "TaikoNauts Conversion Tool",
            dropZone: "Drag & Drop Folder Here",
            rankLabel: "① Select Dan Rank",
            rankNote: "Determines DanIndex (0-18).",
            titleLabel: "② Dan Title (Folder Name)",
            titleNote: "Used as the folder name and JSON title.",
            titlePlaceholder: "Enter Dan Name",
            imageLabel: "③ Image Settings (Dan Plate)",
            imageNote: "If no image is in the folder, the corresponding default image is fetched automatically.",
            plateLabel: "- Dan Plate (danPlatePath)",
            plateAuto: "(Auto-detect and apply)",
            hiddenLabel: "④ Hidden Song Settings",
            songSuffix: " Song",
            btnRun: "Start Conversion",
            btnProcessing: "Processing...",
            btnComplete: "Complete!",
            btnError: "Error",
            logReady: "Ready...",
            defTitleLabel: "★ Overall Course Title (dan.def)",
            defTitleNote: "The overall folder name displayed in-game. Also applies to the downloaded ZIP filename.",
            defTitlePlaceholder: "Dan Dojo",
            statusDetected: "{count} folder(s) detected",
            logDetected: "{count} TJA file(s) detected. Bulk configuration is available.",
            logNoTja: "Error: No TJA files found in the folder.",
            logParseError: "[{folder}] Parse Error: {msg}",
            logProcessing: "[Processing Started] {title} (Rank Index: {index})",
            logResizing: "[{title}] Resizing plate to 1.5x...",
            logResizeFail: "[{title}] Failed to resize plate, saved with original size. ({msg})",
            logPlateFail: "[{title}] Failed to fetch plate.png.",
            logNetError: "Network Error: {img} ({msg})",
            logFolderComplete: "[{title}] Folder structure completed.",
            logDefGenerated: "Multiple folders detected. Generated dan.def ({title}).",
            logAllComplete: "All processes completed. Bulk download started."
        }
    };

    let currentLang = "ja";

    function getMsg(key, vars = {}) {
        let msg = i18n[currentLang][key] || i18n["ja"][key] || key;
        for (let v in vars) {
            msg = msg.replace(`{${v}}`, vars[v]);
        }
        return msg;
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang][key]) {
                el.textContent = i18n[lang][key];
            }
        });
        document.getElementById('dan-title-input').placeholder = i18n[lang].titlePlaceholder;
        
        const defTitleInput = document.getElementById('def-title-input');
        if (defTitleInput) {
            defTitleInput.placeholder = i18n[lang].defTitlePlaceholder;
        }
        updateRunBtnText();
    }

    let btnState = "ready"; // ready, processing, complete, error
    function updateRunBtnText() {
        const btn = document.getElementById('runBtn');
        if (btnState === "ready") btn.textContent = getMsg("btnRun");
        else if (btnState === "processing") btn.textContent = getMsg("btnProcessing");
        else if (btnState === "complete") btn.textContent = getMsg("btnComplete");
        else if (btnState === "error") btn.textContent = getMsg("btnError");
    }

    document.getElementById('lang-select').addEventListener('change', (e) => {
        setLanguage(e.target.value);
        if (danFolders.length > 0) {
            buildMultiFolderUI();
            statusDiv.textContent = getMsg("statusDetected", { count: danFolders.length });
        }
    });

    function getGithubUrl(imageName, rankValue) {
        const baseUrl = "https://raw.githubusercontent.com/fjfjdkdk706-lgtm/TaikoNautsdan-Conversion-tool/main/";
        const danIndex = rankValue - 1; 
        
        let group = "";
        if (danIndex >= 0 && danIndex <= 4) group = "0_4";
        else if (danIndex >= 5 && danIndex <= 9) group = "5_9";
        else if (danIndex >= 10 && danIndex <= 14) group = "10_14";
        else if (danIndex >= 15 && danIndex <= 17) group = "15_17";
        else if (danIndex === 18) group = "18";
        else if (danIndex === 19) group = "19";
        else group = "default";

        if (imageName === "titleplate.png") return `${baseUrl}titleplate_${group}.png`;
        if (imageName === "panelside.png") return `${baseUrl}panelside_${group}.png`;
        if (imageName === "plate.png") return `${baseUrl}plate_${danIndex}.png`; 

        return `${baseUrl}${imageName}`;
    }

    function resizeImage(fileOrBlob, scale) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(fileOrBlob);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const canvas = document.createElement('canvas');
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error("Canvas to Blob failed."));
                }, 'image/png');
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error("Image load failed."));
            };
            img.src = url;
        });
    }

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const runBtn = document.getElementById('runBtn');
    const logArea = document.getElementById('log');
    const statusDiv = document.getElementById('status');
    const settingsArea = document.getElementById('settings-area');
    
    const rankSelect = document.getElementById('rank-select');
    const danTitleInput = document.getElementById('dan-title-input');
    const plateSelect = document.getElementById('plate-select');
    const songListContainer = document.getElementById('song-list-container');

    let danFolders = [];

    function log(msg, type = '') {
        const div = document.createElement('div');
        div.textContent = `> ${msg}`;
        if(type) div.className = `log-${type}`;
        logArea.appendChild(div);
        logArea.scrollTop = logArea.scrollHeight;
    }

    fileInput.addEventListener('change', e => handleFiles(e.target.files));
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#4a90e2'; });
    dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.style.borderColor = '#bdc3c7'; });
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.style.borderColor = '#bdc3c7';
        handleFiles(e.dataTransfer.files);
    });

    async function handleFiles(files) {
        danFolders = [];
        logArea.innerHTML = '';
        statusDiv.textContent = '';
        runBtn.classList.remove('active');
        settingsArea.style.display = 'none';

        const fileList = Array.from(files);
        let pathGroups = {};

        fileList.forEach(f => {
            let pathParts = f.webkitRelativePath ? f.webkitRelativePath.split('/') : [f.name];
            let dir = pathParts.length > 1 ? pathParts.slice(0, -1).join('/') : 'root';
            if(!pathGroups[dir]) pathGroups[dir] = [];
            pathGroups[dir].push(f);
        });

        for (let dir in pathGroups) {
            let dirFiles = pathGroups[dir];
            let tjaFile = dirFiles.find(f => f.name.toLowerCase().endsWith('.tja'));
            if (tjaFile) {
                let images = dirFiles.filter(f => /\.(png|jpe?g|bmp|gif)$/i.test(f.name));
                let folderName = dir.split('/').pop() || "段位";
                if (dir === 'root') folderName = tjaFile.name.replace(/\.[^/.]+$/, "");
                
                let fileMap = new Map();
                dirFiles.forEach(f => fileMap.set(f.name, f));

                danFolders.push({
                    dir: dir,
                    folderName: folderName,
                    tjaFile: tjaFile,
                    images: images.map(i => i.name),
                    fileMap: fileMap,
                    parsedTitle: "",
                    songs: []
                });
            }
        }

        if (danFolders.length > 0) {
            statusDiv.textContent = getMsg("statusDetected", { count: danFolders.length });
            log(getMsg("logDetected", { count: danFolders.length }), 'ok');
            
            for (let folder of danFolders) {
                await scanSongsAndTitleForFolder(folder);
            }
            
            buildMultiFolderUI();
            settingsArea.style.display = 'block';
            runBtn.classList.add('active');
        } else {
            log(getMsg("logNoTja"), 'err');
        }
    }

    function getOrCreateContainer(originalElement, id) {
        let container = document.getElementById(id);
        if (!container) {
            container = document.createElement('div');
            container.id = id;
            originalElement.parentNode.insertBefore(container, originalElement.nextSibling);
        }
        container.innerHTML = '';
        originalElement.style.display = 'none'; 
        return container;
    }

    function buildMultiFolderUI() {
        const existingDefTitle = document.getElementById('def-title-container');
        if (existingDefTitle) existingDefTitle.remove();

        if (danFolders.length > 1) {
            const defTitleContainer = document.createElement('div');
            defTitleContainer.id = 'def-title-container';
            defTitleContainer.className = 'form-group';
            defTitleContainer.innerHTML = `
                <label class="form-label" style="color: #e74c3c;">${getMsg("defTitleLabel")}</label>
                <div class="form-note">${getMsg("defTitleNote")}</div>
                <input type="text" id="def-title-input" placeholder="${getMsg("defTitlePlaceholder")}" value="段位道場">
            `;
            settingsArea.insertBefore(defTitleContainer, settingsArea.firstChild);
        }

        const rankContainer = getOrCreateContainer(rankSelect, 'rank-dynamic-container');
        const titleContainer = getOrCreateContainer(danTitleInput, 'title-dynamic-container');
        const plateContainer = getOrCreateContainer(plateSelect, 'plate-dynamic-container');
        songListContainer.innerHTML = '';

        const rankKeywords = [
            { kw: "五級", val: 1 }, { kw: "四級", val: 2 }, { kw: "三級", val: 3 }, { kw: "二級", val: 4 }, { kw: "一級", val: 5 },
            { kw: "初段", val: 6 }, { kw: "二段", val: 7 }, { kw: "三段", val: 8 }, { kw: "四段", val: 9 }, { kw: "五段", val: 10 },
            { kw: "六段", val: 11 }, { kw: "七段", val: 12 }, { kw: "八段", val: 13 }, { kw: "九段", val: 14 }, { kw: "十段", val: 15 },
            { kw: "玄人", val: 16 }, { kw: "名人", val: 17 }, { kw: "超人", val: 18 }, { kw: "達人", val: 19 }, { kw: "外伝", val: 20 }
        ];

        danFolders.forEach((folder, i) => {
            const labelStr = folder.folderName;

            const rankRow = document.createElement('div');
            rankRow.className = 'multi-row';
            const rankSelectClone = rankSelect.cloneNode(true);
            rankSelectClone.style.display = 'block';
            rankSelectClone.className = 'multi-input';
            
            const checkStr = folder.parsedTitle || folder.folderName;
            const foundRank = rankKeywords.find(item => checkStr.includes(item.kw));
            if (foundRank) {
                rankSelectClone.value = foundRank.val;
            }

            rankRow.innerHTML = `<div class="multi-label" title="${labelStr}">${labelStr}</div>`;
            rankRow.appendChild(rankSelectClone);
            rankContainer.appendChild(rankRow);
            folder.uiRank = rankSelectClone;

            const titleRow = document.createElement('div');
            titleRow.className = 'multi-row';
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.className = 'multi-input';
            titleInput.value = folder.parsedTitle || folder.folderName;
            titleRow.innerHTML = `<div class="multi-label" title="${labelStr}">${labelStr}</div>`;
            titleRow.appendChild(titleInput);
            titleContainer.appendChild(titleRow);
            folder.uiTitle = titleInput;

            const plateRow = document.createElement('div');
            plateRow.className = 'multi-row';
            const plateSel = document.createElement('select');
            plateSel.className = 'multi-input';
            plateSel.innerHTML = `<option value="">${getMsg("plateAuto")}</option>`;
            folder.images.forEach(img => {
                const opt = document.createElement('option');
                opt.value = img;
                opt.textContent = img;
                if (img.toLowerCase() === 'plate.png') opt.selected = true;
                plateSel.appendChild(opt);
            });
            plateRow.innerHTML = `<div class="multi-label" title="${labelStr}">${labelStr}</div>`;
            plateRow.appendChild(plateSel);
            plateContainer.appendChild(plateRow);
            folder.uiPlate = plateSel;

            if (folder.songs.length > 0) {
                const songGroup = document.createElement('div');
                songGroup.style.marginBottom = '15px';
                songGroup.innerHTML = `<div class="multi-label" style="width:auto; margin-bottom:5px;">📁 ${labelStr}</div>`;
                folder.songs.forEach((song, sIdx) => {
                    const div = document.createElement('div');
                    div.className = 'song-option';
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.value = 'true';
                    const lbl = document.createElement('label');
                    lbl.textContent = `${sIdx + 1}${getMsg("songSuffix")}`; 
                    
                    lbl.onclick = () => { cb.checked = !cb.checked; };
                    
                    div.appendChild(cb);
                    div.appendChild(lbl);
                    songGroup.appendChild(div);
                    song.uiCheck = cb;
                });
                songListContainer.appendChild(songGroup);
            }
        });
    }

    async function scanSongsAndTitleForFolder(folder) {
        try {
            const text = await readFileContent(folder.tjaFile);
            const lines = text.split(/\r?\n/);
            let songCount = 0;
            let foundTitle = "";

            if(lines.length > 0 && lines[0].charCodeAt(0) === 0xFEFF) lines[0] = lines[0].substr(1);

            for(let line of lines) {
                const t = line.trim();
                if(!foundTitle && t.toUpperCase().startsWith('TITLE:')) {
                    foundTitle = t.substring(6).trim();
                }
                if(t.toUpperCase().startsWith('#NEXTSONG')) {
                    songCount++;
                    const args = parseNextSongArgs(t);
                    folder.songs.push({ title: args[0] || `Song ${songCount}` });
                }
            }
            folder.parsedTitle = foundTitle;
        } catch(e) {
            log(getMsg("logParseError", { folder: folder.folderName, msg: e.message }), 'warn');
        }
    }

    runBtn.addEventListener('click', async () => {
        if (danFolders.length === 0) return;
        btnState = "processing";
        updateRunBtnText();
        runBtn.classList.remove('active');
        try {
            await processTaikoNautsConversion();
            btnState = "complete";
            updateRunBtnText();
        } catch (e) {
            console.error(e);
            log(`Failed: ${e.message}`, 'err');
            btnState = "error";
            updateRunBtnText();
        }
        setTimeout(() => {
            btnState = "ready";
            updateRunBtnText();
            runBtn.classList.add('active');
        }, 3000);
    });

    async function processTaikoNautsConversion() {
        const zip = new JSZip();
        
        let defTitle = "段位道場";
        if (danFolders.length > 1) {
            const defTitleInput = document.getElementById('def-title-input');
            if (defTitleInput && defTitleInput.value.trim() !== "") {
                defTitle = defTitleInput.value.trim();
            }
        }
        let defLines = [`#TITLE:${defTitle}`];

        for (let idx = 0; idx < danFolders.length; idx++) {
            const folder = danFolders[idx];
            const text = await readFileContent(folder.tjaFile);
            const lines = text.split(/\r?\n/);
            
            const rankValue = parseInt(folder.uiRank.value);
            const userTitle = folder.uiTitle.value.trim() || folder.folderName;
            const danIndexValue = rankValue - 1; 

            log(getMsg("logProcessing", { title: userTitle, index: danIndexValue }), 'info');

            let sections = [];
            let buffer = [];
            let nextTag = "";
            
            if(lines.length > 0 && lines[0].charCodeAt(0) === 0xFEFF) lines[0] = lines[0].substr(1);

            for (let line of lines) {
                if (line.trim().toUpperCase().startsWith('#NEXTSONG')) {
                    sections.push({ lines: buffer, tag: nextTag });
                    buffer = [];
                    nextTag = line.trim();
                } else {
                    buffer.push(line);
                }
            }
            sections.push({ lines: buffer, tag: nextTag });

            let globalExam = { gauge: null, conditions: {} }; 
            let songExams = []; 
            let examOrderList = []; 

            if (sections.length > 0) {
                sections[0].lines.forEach(l => {
                    const line = l.trim();
                    if (line.toUpperCase().startsWith('EXAM') || line.toUpperCase().startsWith('#EXAM')) {
                        const parsed = parseExamLine(line);
                        if (parsed) {
                            if (parsed.isGauge) {
                                globalExam.gauge = parsed.val;
                            } else {
                                globalExam.conditions[parsed.type] = parsed.val; 
                                const existing = examOrderList.find(e => e.type === parsed.type);
                                if (!existing) {
                                    examOrderList.push({ type: parsed.type, index: parsed.index });
                                } else if (existing.index > parsed.index) {
                                    existing.index = parsed.index;
                                }
                            }
                        }
                    }
                });
            }
            
            const rootFolder = zip.folder(userTitle);

            let danSongs = [];
            let globalBpm = 120;
            let balloonCursor = 0;
            
            let globalBalloons = [];
            let tempBalloonStr = "";
            lines.forEach(l => {
                if (l.trim().toUpperCase().startsWith('BALLOON:')) tempBalloonStr += l.trim().substring(8) + ",";
            });
            if (tempBalloonStr) {
                globalBalloons = tempBalloonStr.split(/[,、\s]+/).map(n => parseInt(n)).filter(n => !isNaN(n));
            }

            if (sections.length > 0) {
                sections[0].lines.forEach(l => {
                    if(l.trim().toUpperCase().startsWith('BPM:')) globalBpm = parseFloat(l.split(':')[1]);
                });
                balloonCursor += count79(sections[0].lines);
            }

            let currentBpm = globalBpm; 

            for (let i = 1; i < sections.length; i++) {
                const section = sections[i];
                const args = parseNextSongArgs(section.tag);
                const title = args[0] || `Song_${i}`;
                let subTitle = args[1] === "--" ? "" : (args[1] || "");
                const genre = args[2] || "バラエティ";
                const wave = args[3] || "";
                const scoreInit = args[4] || "0";
                const scoreDiff = args[5] || "0";

                let courseStr = "Oni";
                let level = "10";
                if (args.length >= 8) {
                    if (parseFloat(args[6]) > 4) { level = args[6]; courseStr = mapCourseStr(args[7]); }
                    else { courseStr = mapCourseStr(args[6]); level = args[7]; }
                } else if (args[6]) {
                    level = args[6];
                }

                let myExam = {}; 
                section.lines.forEach(l => {
                    const t = l.trim();
                    if (t.toUpperCase().startsWith('EXAM') || t.toUpperCase().startsWith('#EXAM')) {
                        const parsed = parseExamLine(t);
                        if (parsed && !parsed.isGauge) {
                            myExam[parsed.type] = parsed.val;
                            const existing = examOrderList.find(e => e.type === parsed.type);
                            if (!existing) {
                                examOrderList.push({ type: parsed.type, index: parsed.index });
                            } else if (existing.index > parsed.index) {
                                existing.index = parsed.index;
                            }
                        }
                    }
                });
                songExams[i] = myExam;

                const needed = count79(section.lines);
                let myBalloons = [];
                for (let k = 0; k < needed; k++) {
                    if (balloonCursor < globalBalloons.length) myBalloons.push(globalBalloons[balloonCursor++]);
                    else myBalloons.push(5);
                }

                let songStartBpm = (i === 1) ? globalBpm : currentBpm; 
                let hasFoundBpmChange = false;

                let bodyLines = [];
                let totalDelay = 0;
                section.lines.forEach(l => {
                    const t = l.trim().toUpperCase();
                    if (t.startsWith('COURSE:')) { courseStr = l.split(':')[1].trim(); return; }
                    if (t.startsWith('LEVEL:')) { level = l.split(':')[1].trim(); return; }
                    if (t.startsWith('EXAM') || t.startsWith('#EXAM') || t.startsWith('#LEVELHOLD') || t.startsWith('#SECTION') ||
                        t.startsWith('#START') || t.startsWith('#END') || t.startsWith('BALLOON:') || t.startsWith('TITLE:')) return;
                    
                    if (t.startsWith('BPM:')) {
                        if (!hasFoundBpmChange) songStartBpm = parseFloat(l.split(':')[1]);
                        return;
                    }

                    if (t.startsWith('#DELAY')) {
                        const val = parseFloat(l.trim().split(/\s+/)[1]);
                        if (!isNaN(val)) totalDelay += val;
                        return;
                    }
                    if (t.startsWith('#BPMCHANGE')) {
                        hasFoundBpmChange = true;
                        const parts = l.trim().split(/\s+/);
                        if (parts[1]) currentBpm = parseFloat(parts[1]);
                    }
                    bodyLines.push(l);
                });

                const isHidden = (folder.songs[i - 1] && folder.songs[i - 1].uiCheck) ? folder.songs[i - 1].uiCheck.checked : false;

                let outLines = [];
                outLines.push(`TITLE:${title}`);
                if (subTitle) outLines.push(`SUBTITLE:${subTitle}`);
                outLines.push(`BPM:${songStartBpm}`);
                outLines.push(`WAVE:${wave}`);
                outLines.push(`OFFSET:${-totalDelay}`);
                outLines.push(`GENRE:${genre}`);
                outLines.push(`COURSE:${courseStr}`);
                outLines.push(`LEVEL:${level}`);
                outLines.push(`BALLOON:${myBalloons.join(',')}`);
                outLines.push(`SCOREINIT:${scoreInit}`);
                outLines.push(`SCOREDIFF:${scoreDiff}`);
                outLines.push(`SCOREMODE:2`);
                outLines.push('');
                outLines.push('#START');
                outLines = outLines.concat(bodyLines);
                if (outLines[outLines.length-1].trim() !== "") outLines.push("");
                outLines.push('#END');

                const fileName = `${i}.tja`;
                rootFolder.file(fileName, outLines.join('\r\n'));

                if (wave) {
                    const wName = wave.split(/[/\\]/).pop();
                    if (folder.fileMap.has(wName)) rootFolder.file(wName, folder.fileMap.get(wName));
                }

                danSongs.push({
                    path: fileName,
                    difficulty: mapCourseToInt(courseStr),
                    genre: genre,
                    isHidden: isHidden
                });
            }

            let finalConditions = [];
            examOrderList.sort((a, b) => a.index - b.index);

            examOrderList.forEach(item => {
                const type = item.type;
                let hasIndividual = false;
                for(let i=1; i < sections.length; i++) {
                    if(songExams[i] && songExams[i][type]) { hasIndividual = true; break; }
                }

                if (hasIndividual) {
                    let thresholdArr = [];
                    for(let i=1; i < sections.length; i++) {
                        let val = (songExams[i] && songExams[i][type]) 
                                   ? songExams[i][type] 
                                   : (globalExam.conditions[type] || {red:0, gold:0});
                        thresholdArr.push(val);
                    }
                    finalConditions.push({ type: type, threshold: thresholdArr });
                } else {
                    if (globalExam.conditions[type]) {
                        finalConditions.push({ type: type, threshold: [ globalExam.conditions[type] ] });
                    }
                }
            });

            let finalPlatePath = "plate.png";
            let isLocalPlate = false;
            let plateBlob = null;

            if (folder.uiPlate.value) {
                finalPlatePath = folder.uiPlate.value;
                if (folder.fileMap.has(finalPlatePath)) {
                    plateBlob = folder.fileMap.get(finalPlatePath);
                    isLocalPlate = true;
                }
            } else {
                let localImages = Array.from(folder.fileMap.keys()).filter(name => /\.(png|jpe?g|bmp)$/i.test(name));
                if (folder.fileMap.has("Plate.png")) {
                    finalPlatePath = "Plate.png";
                    plateBlob = folder.fileMap.get("Plate.png");
                    isLocalPlate = true;
                } else if (folder.fileMap.has("plate.png")) {
                    finalPlatePath = "plate.png";
                    plateBlob = folder.fileMap.get("plate.png");
                    isLocalPlate = true;
                } else if (localImages.length > 0) {
                    finalPlatePath = localImages[0];
                    plateBlob = folder.fileMap.get(finalPlatePath);
                    isLocalPlate = true;
                }
            }

            if (!isLocalPlate) {
                finalPlatePath = "plate.png";
                const targetUrl = getGithubUrl("plate.png", rankValue);
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        plateBlob = await res.blob();
                    } else {
                        log(getMsg("logPlateFail", { title: userTitle }), 'warn');
                    }
                } catch (err) {
                    log(getMsg("logNetError", { img: "plate.png", msg: err.message }), 'err');
                }
            }

            if (plateBlob) {
                try {
                    log(getMsg("logResizing", { title: userTitle }), 'info');
                    const resizedPlateBlob = await resizeImage(plateBlob, 1.5);
                    rootFolder.file(finalPlatePath, resizedPlateBlob);
                } catch (err) {
                    log(getMsg("logResizeFail", { title: userTitle, msg: err.message }), 'warn');
                    rootFolder.file(finalPlatePath, plateBlob);
                }
            }

            let finalPanelSidePath = "";
            let finalTitlePlatePath = "";

            if (rankValue === 20) {
                const fetchGitHubImage = async (imageName) => {
                    const targetUrl = getGithubUrl(imageName, rankValue);
                    try {
                        const res = await fetch(targetUrl);
                        if (res.ok) {
                            const blob = await res.blob();
                            rootFolder.file(imageName, blob);
                            return imageName;
                        } else {
                            log(`[${userTitle}] Failed to fetch ${imageName}.`, 'warn');
                        }
                    } catch (err) {
                        log(getMsg("logNetError", { img: imageName, msg: err.message }), 'err');
                    }
                    return "";
                };

                finalPanelSidePath = await fetchGitHubImage("panelside.png");
                finalTitlePlatePath = await fetchGitHubImage("titleplate.png");
            }

            const danJson = {
                title: userTitle,
                danIndex: danIndexValue,
                danPlatePath: finalPlatePath,
                danPanelSidePath: rankValue === 20 ? finalPanelSidePath : "",
                danTitlePlatePath: rankValue === 20 ? finalTitlePlatePath : "",
                danMiniPlatePath: "", 
                danSongs: danSongs,
                conditionGauge: globalExam.gauge || { red: 80, gold: 100 },
                conditions: finalConditions
            };
            rootFolder.file("dan.json", JSON.stringify(danJson, null, 2));
            log(getMsg("logFolderComplete", { title: userTitle }), 'ok');
        }

        let zipFilename = "Converted.zip";
        if (danFolders.length > 1) {
            zip.file("dan.def", defLines.join("\r\n"));
            zipFilename = `${defTitle}.zip`; 
            log(getMsg("logDefGenerated", { title: defTitle }), 'info');
        } else if (danFolders.length === 1) {
            zipFilename = `${danFolders[0].uiTitle.value.trim() || danFolders[0].folderName}.zip`; 
        }

        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = zipFilename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        log(getMsg("logAllComplete"), 'ok');
    }

    function parseExamLine(line) {
        let content = line.replace(/^#?EXAM\d*[:\s]*/i, '').trim();
        const match = line.match(/^#?EXAM(\d+)/i);
        const index = match ? parseInt(match[1], 10) : 999;
        
        const parts = content.split(/,\s*/);
        if (parts.length < 2) return null;

        const typeRaw = parts[0].toLowerCase();
        const red = parseFloat(parts[1]);
        const gold = parseFloat(parts[2]); 

        if (isNaN(red)) return null;
        const valObj = { red: red, gold: isNaN(gold) ? red : gold };

        if (['g', 'gauge'].includes(typeRaw)) return { type: 'Gauge', val: valObj, isGauge: true, index: index };

        let typeName = "";
        if (['p', 'jp', 'perfect', 'judge_p', 'gr'].includes(typeRaw)) typeName = "Great";
        else if (['g', 'jg', 'good', 'judge_g', 'gd'].includes(typeRaw)) typeName = "Good";
        else if (['b', 'jb', 'bad', 'miss', 'judge_b'].includes(typeRaw)) typeName = "Miss";
        else if (['r', 'jr', 'roll', 'judge_r'].includes(typeRaw)) typeName = "Roll";
        else if (['h', 'jh', 'hit', 'judge_h'].includes(typeRaw)) typeName = "HitCount";
        else if (['c', 'jc', 'combo'].includes(typeRaw)) typeName = "MaxCombo";
        else if (['s', 'js', 'score'].includes(typeRaw)) typeName = "Score";
        else if (['a', 'adlib'].includes(typeRaw)) typeName = "ADLIB";

        if (!typeName) return null;
        return { type: typeName, val: valObj, isGauge: false, index: index };
    }

    function readFileContent(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const buffer = e.target.result;
                const decoderSJIS = new TextDecoder('shift-jis');
                const textSJIS = decoderSJIS.decode(buffer);
                if (textSJIS.includes('TITLE:') || textSJIS.includes('COURSE:')) {
                    resolve(textSJIS);
                } else {
                    resolve(new TextDecoder('utf-8').decode(buffer));
                }
            };
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }

    function count79(lines) {
        let count = 0;
        for (let line of lines) {
            let trim = line.trim();
            if (!trim || trim.startsWith('//') || trim.includes(':') || trim.startsWith('#')) continue;
            for (let char of trim.split('//')[0]) {
                if (char === '7' || char === '9') count++;
            }
        }
        return count;
    }

    function parseNextSongArgs(tag) {
        return tag.replace(/^#NEXTSONG\s+/i, '').split(',').map(s => s.trim());
    }

    function mapCourseStr(val) {
        const map = ["Easy", "Normal", "Hard", "Oni", "Edit"];
        return map[parseInt(val)] || "Oni";
    }

    function mapCourseToInt(str) {
        const map = { "Easy": 0, "Normal": 1, "Hard": 2, "Oni": 3, "Edit": 4 };
        return map[str] !== undefined ? map[str] : 3;
    }
